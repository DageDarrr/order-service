version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: order-service-postgres  # Это просто имя контейнера
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service-app
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
      - /app/__pycache__
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=postgres  # ВАЖНО: здесь имя сервиса, а не контейнера!
      - DB_PORT=5432      # ВАЖНО: внутренний порт PostgreSQL, а не внешний!
      - APP_PORT=${APP_PORT}
      - PYTHONUNBUFFERED=1
      - DEBUG=1
    networks:
      - microservices-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    restart: unless-stopped

networks:
  microservices-network:
    name: microservices-network
    driver: bridge

volumes:
  postgres_data:
    name: order-service-postgres-data